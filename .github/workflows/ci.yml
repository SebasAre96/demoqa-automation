name: CI - DemoQA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes a viernes 06:00 UTC (03:00 Argentina)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        type: choice
        options: [chrome, firefox]
        default: chrome
      suite:
        description: 'Suite'
        type: choice
        options: [smoke, regression]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER: ${{ inputs.browser || 'chrome' }}
      SUITE: ${{ inputs.suite || 'smoke' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests (${{ env.SUITE }} / ${{ env.BROWSER }})
        run: |
          if [ "$SUITE" = "smoke" ]; then
            TAGS='@smoke and not @ignore'
          else
            TAGS='not @ignore'
          fi
          mvn -B test \
            -Dbrowser="$BROWSER" \
            -Dheadless=true \
            -Dcucumber.filter.tags="$TAGS"

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/cucumber-reports.html
            target/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Allure report for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy-report:
    # Publica el reporte Allure en GitHub Pages (no en pull requests)
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
